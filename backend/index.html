<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedidos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f6f8;
      padding: 40px 16px;
    }

    h1 {
      text-align: center;
      margin-bottom: 32px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: #ffffff;
      padding: 20px 22px;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-header span {
      font-size: 12px;
      color: #666;
    }

    .titulo {
      font-size: 16px;
      font-weight: 600;
      margin: 6px 0;
    }

    .descricao {
      font-size: 14px;
      color: #444;
    }

    .info {
      font-size: 13px;
      color: #555;
    }

    .loading, .error {
      text-align: center;
      color: #777;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <h1>Lista de Pedidos</h1>

  <div id="content" class="loading">Carregando pedidos...</div>

  <script>
    async function carregarPedidos() {
      const content = document.getElementById('content');

      try {
        const response = await fetch('http://localhost:8080/');
        const data = await response.json();

        if (!Array.isArray(data) || data.length === 0) {
          content.innerHTML = '<div class="error">Nenhum pedido encontrado</div>';
          return;
        }

        content.className = 'container';
        content.innerHTML = '';

        data.forEach(pedido => {
          const card = document.createElement('div');
          card.className = 'card';

          card.innerHTML = `
            <div class="card-header">
              <strong>#${pedido.id}</strong>
              <span>${new Date(pedido.dataPedido).toLocaleDateString('pt-BR')}</span>
            </div>

            <div class="titulo">${pedido.titulo}</div>

            <div class="descricao">${pedido.descricao}</div>

            <div class="info"><strong>Solicitante:</strong> ${pedido.nomeSolicitante}</div>
            <div class="info"><strong>Entrega:</strong> ${new Date(pedido.dataEntrega).toLocaleDateString('pt-BR')}</div>
          `;

          content.appendChild(card);
        });

      } catch (error) {
        content.innerHTML = '<div class="error">Erro ao carregar os pedidos</div>';
      }
    }

    carregarPedidos();
  </script>

</body>
</html>
